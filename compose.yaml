services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MONGO_URL: mongodb://mongo:27017
    depends_on:
      mongo:
        condition: service_healthy
  mongo:
    image: mongo:7.0.16
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mongo_data:/data/db
volumes:
  mongo_data:
